# Four lab servers. Start: docker compose -f infra/servers/compose.yaml up -d --build
x-server: &server
  build: .
  privileged: true
  cgroup: host
  tmpfs: [/run, /run/lock, /tmp]
  volumes:
    - /sys/fs/cgroup:/sys/fs/cgroup:rw
    - ${HOME}/.ssh/id_ed25519.pub:/keys/authorized_keys:ro

services:
  web1:
    <<: *server
    hostname: web1
    ports: ["2201:22"]
  web2:
    <<: *server
    hostname: web2
    ports: ["2202:22"]
  db:
    <<: *server
    hostname: db
    ports: ["2203:22"]
  lb:
    <<: *server
    hostname: lb
    ports: ["2204:22", "8080:80"]
