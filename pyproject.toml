[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Starlette asks for "httpx2"; the test client still works with httpx.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
