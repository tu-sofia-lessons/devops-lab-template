site_name: Notes API
site_description: Service documentation for the DevOps course labs
docs_dir: docs
theme:
  name: material
  features:
    - content.code.copy
nav:
  - Home: index.md
  - Service: service.md
  - Runbook: runbook.md
  - Glossary: glossary.md
  - On-call: oncall.md
  - Decisions:
      - adr/index.md
      - adr/0001-record-architecture-decisions.md
markdown_extensions:
  - tables
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences

exclude_docs: |
  adr/template.md
